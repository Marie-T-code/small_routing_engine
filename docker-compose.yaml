name : sre_dev
version: '3.9' # if you are in compose v2 you can comment/delete this entire line

services:
  db:
    build: ./DB
    env_file: ./.env
    ports:
      - "${PG_PORT:?PG_PORT not set in .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./DATA/clean:/import:ro
      - ./DB/init_db:/docker-entrypoint-initdb.d:ro
      - ./SQL:/SQL:ro
    restart: "no"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: 
      - routing_net

# ----------------------------
# DEV EXPORT SERVICE : BUILDER
# ----------------------------

  builder_dev:
    build: ./docker/psql_client
    profiles: ["devtools"]
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./SQL:/SQL:ro
      - ./exports:/exports
    user: "${UID:-1000}:${GID:-1000}"
    networks: 
      - routing_net


  api:
    build: ./app
    env_file: ./.env
    ports:
      - "${FLASK_PORT:?FLASK_PORT not set in .env}:5000"
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/test_db"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: 
      - routing_net

# ----------------------------
  # PIPELINE : LOADER
  # ----------------------------

  loader:
    profiles: ["pipeline"]
    build: ./docker/loader
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./DATA/clean:/import
      - ./SQL:/SQL:ro
      - ./docker/loader:/loader:ro
      - ./performance:/performance:ro   
    command: ["bash", "/loader/import_all.sh"]
    networks: 
      - routing_net



  # ----------------------------
  # PIPELINE : BUILDER
  # ----------------------------
  builder:
    profiles: ["pipeline"]
    build: ./docker/psql_client
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - ./SQL:/SQL:ro
      - ./exports:/exports
      - ./docker/builder:/builder:ro
    command: ["bash", "/builder/run_master_all.sh"]
    networks: 
      - routing_net

networks:
  routing_net:
    driver: bridge

volumes:
  pgdata:
